name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      fedotmas: ${{ steps.filter.outputs.fedotmas }}
      web-scraping: ${{ steps.filter.outputs.web-scraping }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          filters: |
            fedotmas:
              - "packages/fedotmas/**"
            web-scraping:
              - "mcp-servers/web-scraping/**"

  test-fedotmas:
    needs: detect
    if: needs.detect.outputs.fedotmas == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
      - run: uv run pytest packages/fedotmas/tests/

  test-web-scraping:
    needs: detect
    if: needs.detect.outputs.web-scraping == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-servers/web-scraping
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --dev
      - run: uv run pytest tests/

  ci:
    runs-on: ubuntu-latest
    if: always()
    needs: [test-fedotmas, test-web-scraping]
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more test jobs failed or were cancelled"
            exit 1
          fi
