[project]
name = "fedotmas-workspace"
version = "0.0.0"
description = "FEDOT.MAS workspace"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fedotmas",
  "langfuse>=4.3.1",
]

[dependency-groups]
dev = [
  "prek>=0.3.3",
  "pytest>=8",
  "pytest-asyncio>=0.25",
  "ruff>=0.15.1",
  "ty>=0.0.17",
]
docs = [
  "zensical>=0.0.28",
]
gaia = [
  "datasets>=3",
  "huggingface-hub>=0.30",
  "tenacity>=9",
  "tqdm>=4",
]

[tool.uv]
sources.fedotmas = { workspace = true }
package = false
workspace.members = [ "packages/*" ]

[tool.ruff]
exclude = [ "**/tests/**" ]

[tool.pytest]
ini_options.asyncio_mode = "auto"
ini_options.testpaths = [
  "packages/fedotmas/tests",
]

[tool.ty]
rules.unresolved-import = "ignore"
rules.possibly-missing-import = "ignore"
src.exclude = [ "**/tests/" ]
