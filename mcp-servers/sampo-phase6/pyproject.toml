[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.3,<0.11" ]

[project]
name = "mcp-sampo-phase6"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [ "fastmcp>=2.14.5" ]

[project.scripts]
mcp-sampo-phase6 = "mcp_sampo_phase6.server:main"

[dependency-groups]
dev = [ "pytest", "pytest-asyncio" ]

[tool.fedotmas]
mcp.name = "sampo-phase6"
mcp.description = "Public SAMPO candidate data and prediction storage tools. Candidate artifacts and prediction records are restricted to the current assigned batch."
mcp.tags = [ "sampo", "benchmark", "public-data", "safe" ]
mcp.timeout = 180
