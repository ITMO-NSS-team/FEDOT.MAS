[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.3,<0.11" ]

[project]
name = "fedotmas"
version = "0.1.0"
description = "Multi-Agent Systems Generation"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "google-adk[mcp]>=2.3,<3",
  "litellm>=1.80.16",
  "loguru>=0.7.3",
  # mcp is imported directly by fedotmas/mcp/registry.py. The <2 ceiling is
  # load-bearing: mcp 2.0 dropped mcp.shared.session, which google-adk still
  # imports, and adk swallows the failure into an empty __all__ — surfacing as
  # "cannot import name McpToolset" rather than anything about mcp.
  "mcp>=1.27.1,<2",
  "platformdirs>=4.9.2",
  "pydantic>=2.12.5",
  "python-dotenv>=1.2.1",
  "rich>=14.3.2"
]
optional-dependencies.langfuse = [ "langfuse>=2" ]

[tool.uv]
build-backend.module-name = "fedotmas"
